services:
  frontend:
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
    user: "${UID:-1000}:${GID:-1000}"
    ports:
      - "40080:40080"
    volumes:
      - .:/app
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:40080"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
